name: fitlink
description: FitLink – connects gym-goers, personal trainers and gym owners in Egypt.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0

  # State + navigation
  provider: ^6.1.2
  go_router: ^16.0.0

  # Networking / backend
  http: ^1.2.2

  # Device capabilities
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0

  # Maps (OpenStreetMap)
  flutter_map: ^8.1.0
  latlong2: ^0.9.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # UI helpers
  fl_chart: ^1.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
